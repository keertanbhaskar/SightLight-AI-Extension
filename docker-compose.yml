# Production-style stack: Postgres + API + dashboard. `cp .env.example .env` and fill it in first.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sightlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sightlite}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sightlite}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sightlite}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (>=32 chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      FORWARDED_ALLOW_IPS: "*"   # api is only reachable through the web container's proxy
    expose: ["8000"]

  web:
    build:
      context: ./apps/web
      args: { VITE_API_BASE_URL: "" }
    restart: unless-stopped
    depends_on: [api]
    ports: ["${WEB_PORT:-8080}:8080"]

volumes:
  pgdata:
